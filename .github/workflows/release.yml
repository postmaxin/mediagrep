name: Release

# Pushing a tag like v0.1.0 builds the release archives and creates a
# *draft* GitHub release with them; publishing it stays a human decision.
# Run it by hand (workflow_dispatch) to build the archives without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the Windows job runs a downloaded DLL during its tests.
# Only the draft job, which runs nothing from the build, may write.
permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check the tag against CMakeLists.txt
        run: |
          project=$(sed -n 's/^project(mediagrep VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$project" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project version $project"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$project-dev" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the MediaInfo DLL and its license (checked against a pinned hash)
        uses: ./.github/actions/mediainfo-dll
      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check the exe needs no Visual C++ runtime
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bad = $false
          foreach ($f in "build\Release\mediagrep.exe", "$env:RUNNER_TEMP\mediainfo\MediaInfo.dll") {
            Write-Host "== $f"
            $out = & $dumpbin /dependents $f | Out-String
            Write-Host $out
            # Only system DLLs may be needed: the zip does not ship the redistributable.
            if ($out -match '(?im)^\s+(vcruntime|msvcp|concrt|vcomp|ucrtbase|api-ms-win-crt)') {
              Write-Host "::error::$f depends on the Visual C++ runtime"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $name = "mediagrep-${{ needs.version.outputs.version }}-windows-x64"
          $d = "dist\$name"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item build\Release\mediagrep.exe, README.md, CHANGELOG.md $d
          Copy-Item LICENSE "$d\LICENSE.txt"
          Copy-Item "$env:RUNNER_TEMP\mediainfo\MediaInfo.dll" $d
          Copy-Item "$env:RUNNER_TEMP\mediainfo\License.html" "$d\MediaInfoLib-License.html"
          & "$d\mediagrep.exe" --version
          Compress-Archive -Path $d -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    name: Linux x86_64
    needs: version
    # The oldest supported runner, for the oldest glibc requirement.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfoLib (for the tests; the binary loads it at runtime)
        run: sudo apt-get update && sudo apt-get install -y libmediainfo0v5 ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="mediagrep-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp build/mediagrep build/mediagrep.1 README.md CHANGELOG.md LICENSE "dist/$name/"
          # The MediaInfoDLL headers are compiled in; their BSD notice must ship too.
          cp third_party/MediaInfoDLL/License.html "dist/$name/MediaInfoLib-License.html"
          strip "dist/$name/mediagrep"
          "dist/$name/mediagrep" --version
          ldd "dist/$name/mediagrep"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
      - name: Build the .deb and .rpm
        run: |
          sudo apt-get install -y lintian rpm
          cpack --config build/CPackConfig.cmake -B pkg
          # Errors fail the job; warnings are for a person to read.
          lintian --fail-on error --info pkg/*.deb || exit 1
          dpkg-deb -I pkg/*.deb
          dpkg-deb -c pkg/*.deb
          rpm -qp --requires pkg/*.rpm
          rpm -qlp pkg/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            pkg/*.deb
            pkg/*.rpm

  # Install each package into a clean distribution image, with only that
  # image's own repositories, to prove the dependency on MediaInfoLib is
  # declared: it is loaded with dlopen, so nothing detects it automatically.
  package-check:
    name: Install ${{ matrix.name }}
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: .deb in debian:stable
            image: debian:stable
            install: apt-get update -qq && apt-get install -y ./mediagrep_*.deb
          - name: .rpm in fedora:latest
            image: fedora:latest
            install: dnf install -y ./mediagrep-*.rpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
      - name: Install and run
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/tests/fixtures:/fixtures:ro"             ${{ matrix.image }} sh -euc '
              cd /pkg
              ${{ matrix.install }}
              out=$(mediagrep --version)
              echo "$out"
              case "$out" in *"not found"*) echo "MediaInfoLib was not installed"; exit 1;; esac
              mediagrep -ri engineering /fixtures
            '

  # opkg packages for Entware (NAS boxes). Entware has its own glibc (2.27),
  # so the binary is built natively inside Entware, not from the Linux job's.
  # The other architectures run under QEMU.
  entware:
    name: Entware ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64-3.2
            feed: x64-k3.2
            platform: linux/amd64
          - arch: aarch64-3.10
            feed: aarch64-k3.10
            platform: linux/arm64
          - arch: armv7-3.2
            feed: armv7sf-k3.2
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64'
      - name: Build and test inside Entware, and pack the .ipk
        run: |
          mkdir -p ipk
          docker run --rm --platform ${{ matrix.platform }}             -v "$PWD:/src:ro" -v "$PWD/ipk:/out" debian:stable-slim             sh /src/tools/entware-ci.sh build ${{ matrix.feed }} ${{ matrix.arch }}
      - name: Install the .ipk into a fresh Entware and run it
        run: |
          docker run --rm --platform ${{ matrix.platform }}             -v "$PWD:/src:ro" -v "$PWD/ipk:/out:ro" debian:stable-slim             sh /src/tools/entware-ci.sh check ${{ matrix.feed }}
      - name: Package contents
        run: |
          for f in ipk/*.ipk; do
            echo "== $f"; tar -tzvf "$f"
            tar -xzOf "$f" ./control.tar.gz | tar -tzv
            tar -xzOf "$f" ./control.tar.gz | tar -xzO ./control
            tar -xzOf "$f" ./data.tar.gz | tar -tzv
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: ipk/*.ipk

  draft:
    name: Draft release
    needs: [version, windows, linux, package-check, entware]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          notes=$(awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "mediagrep ${{ needs.version.outputs.version }}" --notes "$notes"

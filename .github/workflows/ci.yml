name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.link }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [dynamic, static]
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfoLib
        run: |
          sudo apt-get update
          sudo apt-get install -y libmediainfo-dev libmediainfo0v5 pkg-config ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMEDIAGREP_LINK_STATIC=${{ matrix.link == 'static' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke
        run: ./build/mediagrep --version && ./build/mediagrep -ri engineering tests/fixtures

  # 32-bit x86 in an i386 Debian container, to catch what a 32-bit NAS would
  # hit: off_t, struct stat and ino_t are 32-bit unless _FILE_OFFSET_BITS=64.
  # The container has its own 32-bit MediaInfoLib, so the whole suite runs.
  linux-i386:
    name: Linux (32-bit x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in an i386 container
        run: |
          # The checkout belongs to the runner's uid, which the container has no
          # passwd entry for; the File track tests expect its owner to have a name.
          docker run --rm -e CI_UID="$(id -u)" -e CI_GID="$(id -g)" -v "$PWD":/src:ro \
            i386/debian:trixie-slim bash -euxc '
            apt-get update
            apt-get install -y g++ cmake ninja-build pkg-config libmediainfo-dev libmediainfo0v5
            echo "ci:x:$CI_UID:$CI_GID::/:/bin/sh" >> /etc/passwd
            echo "ci:x:$CI_GID:" >> /etc/group
            test "$(dpkg --print-architecture)" = i386
            cmake -S /src -B /build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /build
            cd /build && linux32 ctest --output-on-failure
          '

  macos:
    name: macOS (${{ matrix.link }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        link: [dynamic, static]
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfoLib
        run: brew install media-info ninja pkg-config
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMEDIAGREP_LINK_STATIC=${{ matrix.link == 'static' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke
        run: ./build/mediagrep --version && ./build/mediagrep -ri engineering tests/fixtures

  windows:
    name: Windows (dynamic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfo DLL (checked against a pinned hash)
        uses: ./.github/actions/mediainfo-dll
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke
        shell: pwsh
        run: |
          .\build\Release\mediagrep.exe --version
          .\build\Release\mediagrep.exe -ri engineering tests\fixtures

  # The BSDs run in virtual machines (vmactions). Each builds with the
  # system's own compiler and runs the whole suite against the system's
  # MediaInfoLib package (libmediainfo, loaded at runtime).
  #
  # The VM gets the checkout with its owner's numeric uid and gid, which the
  # VM has no passwd or group entry for, and the File track tests expect the
  # owner to have a name. So the run step adds an entry first (the i386 job
  # does the same).
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          prepare: |
            pkg install -y cmake ninja pkgconf libmediainfo
          run: |
            set -eux
            uname -a
            uid=$(stat -f %u .)
            gid=$(stat -f %g .)
            getent group "$gid" || pw groupadd ci -g "$gid"
            getent passwd "$uid" || pw useradd ci -u "$uid" -g "$gid" -s /usr/sbin/nologin
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            ctest --test-dir build --output-on-failure
            ./build/mediagrep --version
            ./build/mediagrep -ri engineering tests/fixtures

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "8.0"
          prepare: |
            pkg_add cmake ninja libmediainfo
          run: |
            set -eux
            uname -a
            uid=$(stat -f %u .)
            gid=$(stat -f %g .)
            getent group "$gid" || groupadd -g "$gid" ci
            getent passwd "$uid" || useradd -u "$uid" -g "$gid" -s /sbin/nologin ci
            ls -l /usr/local/lib | grep -i mediainfo || true
            pkg_info -L libmediainfo || true
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            ctest --test-dir build --output-on-failure
            ./build/mediagrep --version
            ./build/mediagrep -ri engineering tests/fixtures

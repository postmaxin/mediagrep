name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.link }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [dynamic, static]
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfoLib
        run: |
          sudo apt-get update
          sudo apt-get install -y libmediainfo-dev libmediainfo0v5 pkg-config ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMEDIAGREP_LINK_STATIC=${{ matrix.link == 'static' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke
        run: ./build/mediagrep --version && ./build/mediagrep -ri engineering tests/fixtures

  # 32-bit x86 in an i386 Debian container, to catch what a 32-bit NAS would
  # hit: off_t, struct stat and ino_t are 32-bit unless _FILE_OFFSET_BITS=64.
  # The container has its own 32-bit MediaInfoLib, so the whole suite runs.
  linux-i386:
    name: Linux (32-bit x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in an i386 container
        run: |
          docker run --rm -v "$PWD":/src:ro i386/debian:trixie-slim bash -euxc '
            apt-get update
            apt-get install -y g++ cmake ninja-build pkg-config libmediainfo-dev libmediainfo0v5
            test "$(dpkg --print-architecture)" = i386
            cmake -S /src -B /build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /build
            cd /build && linux32 ctest --output-on-failure
          '

  macos:
    name: macOS (${{ matrix.link }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        link: [dynamic, static]
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfoLib
        run: brew install media-info ninja pkg-config
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMEDIAGREP_LINK_STATIC=${{ matrix.link == 'static' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke
        run: ./build/mediagrep --version && ./build/mediagrep -ri engineering tests/fixtures

  windows:
    name: Windows (dynamic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MediaInfo DLL
        shell: pwsh
        run: |
          $v = "26.10"
          $url = "https://mediaarea.net/download/binary/libmediainfo0/$v/MediaInfo_DLL_${v}_Windows_x64_WithoutInstaller.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mediainfo.zip"
          Expand-Archive "$env:RUNNER_TEMP\mediainfo.zip" -DestinationPath "$env:RUNNER_TEMP\mediainfo"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\mediainfo"
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke
        shell: pwsh
        run: |
          .\build\Release\mediagrep.exe --version
          .\build\Release\mediagrep.exe -ri engineering tests\fixtures
